[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stellarweave-trace"
version = "0.1.0"
description = "StellarWeave evaluation infrastructure — trace substrate + assertion funnel. Built with Devin."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/stellarweave_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]